<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pair prompts</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --text: #000000;
    --sub: #8a8a8a;
    --faint: #c4c4c4;
    --soft: #f5f5f5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Pretendard', sans-serif;
    background: #fff;
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 600px; margin: 0 auto; padding: 40px 20px 60px; }

  /* ===== 사진 저장 방지 — 길게 누르기 메뉴 / 드래그 막기 ===== */
  img {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }

  /* ===== 첫 화면: 큰 숫자 지그재그 — 화면 세로 전체에 퍼지게 ===== */
  #home {
    display: flex; flex-direction: column;
    min-height: calc(100vh - 100px);
    min-height: calc(100svh - 100px);
  }
  #list {
    flex: 1;
    display: flex; flex-direction: column;
    justify-content: space-evenly;
    gap: 8px;
  }
  .row { display: flex; }
  .pt { position: relative; display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .num {
    font-size: 72px; font-weight: 800; font-style: italic;
    color: transparent; -webkit-text-stroke: 1.2px var(--text);
    line-height: 1; letter-spacing: -3px; padding-right: 6px;
  }
  @media (min-width: 600px) { .num { font-size: 104px; -webkit-text-stroke: 1.5px var(--text); } }
  .lbl {
    font-size: 11px; font-weight: 500;
    border: 1px solid var(--text); background: #fff;
    padding: 2px 6px; white-space: nowrap;
  }
  /* 마우스 있는 기기: 숫자에 올리면 이름으로 바뀜 / 폰: 이름이 숫자 옆에 항상 보임 */
  @media (hover: hover) {
    .pt { gap: 0; }
    .lbl { position: absolute; top: 50%; left: 0; transform: translateY(-50%); visibility: hidden; }
    .pt:hover .num { visibility: hidden; }
    .pt:hover .lbl { visibility: visible; }
  }

  .sign { margin-top: 28px; width: 110px; display: flex; flex-direction: column; gap: 6px; }
  .sign i { height: 1px; background: var(--text); }
  .sign span { font-size: 12px; color: var(--sub); letter-spacing: -0.2px; }

  /* ===== 페어 화면 ===== */
  .back { display: inline-block; font-size: 12px; font-weight: 600; cursor: pointer; user-select: none; margin-bottom: 12px; }

  .car, .sl { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .car::-webkit-scrollbar, .sl::-webkit-scrollbar { display: none; }
  .au, .sd { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; }
  .au { cursor: pointer; -webkit-touch-callout: none; }
  /* AU 사진 비율 — 2 / 1 숫자를 바꾸면 사진 높이가 달라져요 */
  /* 사진은 크든 작든 가로폭에 꽉 맞춰지고, 높이는 사진 비율대로 자동 */
  .au-img { width: 100%; overflow: hidden; }
  .au-img img { width: 100%; height: auto; display: block; }
  /* 사진 없을 때 회색 칸 비율 */
  .au-img.noimg { aspect-ratio: 2 / 1; background: var(--soft); }
  /* 사진 칸 높이를 지금 보이는 사진에 맞춤 — 아래 글씨가 항상 사진 바로 밑에 붙어요 */
  /* 사진 칸 높이는 바깥 틀(carwrap)에서만 바꿔요 — 넘기는 칸 자체는 건드리지 않아서 튕김 없음 */
  .carwrap { overflow: hidden; }
  .car { align-items: flex-start; overscroll-behavior-x: contain; }
  .au { scroll-snap-stop: always; }

  /* 처음엔 사진이 화면 가운데 → 누르면 위로 올라가면서 프롬프트 등장 */
  .top { transition: transform .4s cubic-bezier(.2,.7,.2,1); will-change: transform; }
  .panel { animation: rise .4s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .noimg { display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--sub); }
  .aubar { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: var(--sub); }
  .aubar b { color: var(--text); font-weight: 600; }
  .hint { font-size: 11px; color: var(--faint); margin-top: 2px; }

  /* 프롬프트 창 */
  .panel { border-top: 1px solid var(--text); padding-top: 12px; margin-top: 14px; }
  .tabs { display: flex; gap: 14px; margin-bottom: 10px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { font-size: 13px; font-weight: 700; color: var(--faint); cursor: pointer; user-select: none; white-space: nowrap; }
  .tab.on { color: var(--text); }
  .field { margin-bottom: 10px; }
  .field-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .field-label { font-size: 11px; font-weight: 700; color: var(--sub); }
  .box { background: var(--soft); padding: 8px 10px; font-size: 12px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .box.empty { color: var(--faint); }
  .btn {
    display: inline-block; font-size: 11px; font-weight: 600; line-height: 1.5;
    background: var(--text); color: #fff;
    border: 1px solid var(--text); border-radius: 0;
    padding: 2px 8px; min-width: 44px; text-align: center;
    cursor: pointer; user-select: none;
  }
  .btn.all { background: #fff; color: var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <div id="home">
    <div id="list"></div>
    <div class="sign"><i></i><span>pair prompts</span></div>
  </div>
  <div id="view" style="display:none"></div>
</div>

<script>
/* ============================================
   ✏️ 여기만 고치면 돼요!

   페어 하나 = { } 덩어리 하나 (순서대로 01, 02, 03... 위치는 자동)
   name: 숫자에 올리면 / 폰에서 옆에 보이는 이름
   aus: 사진 + 프롬프트 묶음. AU가 여러 개면 { } 를 더 추가 → 옆으로 넘겨져요
        label: AU 이름 / image: 사진 파일 이름 (예: "pair1.jpg")
   프롬프트는 ` ` (백틱) 사이에 넣기
   ============================================ */
const pairs = [
  {
    name: "pyoyuri & kangsoyi",
    aus: [
      {
        label: "original",
        image: "",
        chars: [
          { name: "표유리", look: `boy, aged up, slim, pale skin, 1.2::broad shoulders::, yellow hair, messy hair, 1.5::shaggy cut::, 0.1::wolf cut::, short mullet, 2.5::swept bangs::, short bangs, 1.2::straight hair::, -1::wavy hair, long hair, layered hair, blunt and, smile, angry, angry eyebrows, piercing, thick eyebrows::, dark grey eyes, 0.5::half-closed eyes, tsurime::, 0.8::jitome::, emotionless,`, outfit: `denim jacket, light blue rounded neck shirt, black slacks, white sneakers, white earphones, y2k,` },
          { name: "강소이", look: `girl, aged up, slim, pale skin, 0.3::medium breasts::, 2::ash blonde hair::, blunt bangs, hair between eyes, long sidelocks, 0.2::messy hair::, straight hair, long hair, dark brown eyes, 0.1::tareme::, 0.4::half lidded eyes::, above eyebrows, eyelashes, -1::swept bangs, thick eyebrows::, parted lips, light smile,`, outfit: `brown leather jacket, white rounded neck shirt, indigo denim pants, bootcut jeans, washed denim, black chuck taylors sneakers, y2k,` }
        ]
      },
      {
        label: "사복 추가 예정...",
        image: "",
        chars: [
          { name: "표유리", look: ``, outfit: `` },
          { name: "강소이", look: ``, outfit: `` }
        ]
      }
    ]
  },
  {
    name: "lecce & hallstatt",
    aus: [
      {
        label: "original",
        image: "https://i.imgur.com/4d5b8eG.png",
        chars: [
          { name: "LECCE", look: `male, aged up, tall, slim, handsome, pale skin, broad shoulders, 1.3::short hair::, 0.2::messy hair::, curtained hair, blonde hair, 0.6::pink tint hair::, 0.5::wavy hair::, 0.4::neck length::, 2::half-closed eyes, white eyes::, 0.5::tsurime::, relaxed expression, parted lips, light smile, -1::blush, long hair, wolf cut::,`, outfit: `black long coat on the shoulders, white collared shirt, black necktie, silver tie clip, black harness, black leather gloves, dark grey slacks, black loafers` },
          { name: "HALLSTATT", look: `girl, aged up, 1.2::slim::, pale skin, medium breasts, 2::white ash blonde hair::, 1.2::long hair::, swept bangs, straight hair, long sidelocks, 0.1::messy hair::, 0.3::wavy hair::, greyish blue eyes, 0.5::tsurime::, 0.9::half lidded eyes::, -1::blush::, emotionless, parted lips,
          
low ponytail ← 추가 자유`, outfit: `white collared shirt, black necktie, silver tie clip, black harness, black high waisted slacks, bare ankle, black low heeled ankle boots, -1::gloves::,` }
        ]
      },
      {
        label: "사복 추가 예정...",
        image: "",
        chars: [
          { name: "LECCE", look: ``, outfit: `` },
          { name: "HALLSTATT", look: ``, outfit: `` }
        ]
      }
    ]
  },
  {
    name: "syndrome & ivy",
    aus: [
      {
        label: "original",
        image: "",
        chars: [
          { name: "SYNDROME", look: `male, bishonen, pale skin, ash brown hair, 0.5::ash brown hair, soft mullet::, ::wolf cut, curtained bangs, parted hair::, 0.4::messy hair::, straight hair, black eyes, aegyo-sal, half lidded eyes, 0.5::blush::, 0.3::V-shaped eyebrows::, 0.4::emotionless::, broad shoulders, athletic build, slim,`, outfit: `black open formal jacket, white collared shirt, black necktie, black leather gloves, black pants, black socks, black loafer,
` },
          { name: "IVY", look: `girl, slim, pale skin, medium breasts, beige hair, 0.1::messy hair::, 1.3::long hair, long locks, hair behind one ear::, straight hair, 0.3::wavy hair::, center-flap bangs, hair between eyes, palm eyelashes, deep blue eyes, 0.1::tsurime::, round eye, aegyo-sal, 0.5::half lidded eyes::, 0.2::blush::, light smile, parted lips,`, outfit: `white collared shirt, black necktie, black formal jacket, a matching black pencil miniskirt, black mid-calf combat boots,` }
        ]
      },
      {
        label: "사복 추가 예정...",
        image: "",
        chars: [
          { name: "SYNDROME", look: ``, outfit: `` },
          { name: "IVY", look: ``, outfit: `` }
        ]
      }
    ]
  }
];
/* ============================================ */

/* 숫자 들여쓰기 패턴 (%) — 이 순서대로 반복돼요 */
const steps = [0, 46, 16, 52, 4, 34];

const home = document.getElementById('home');
const view = document.getElementById('view');

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function num(i) { return String(i + 1).padStart(2, '0'); }

/* 첫 화면 숫자 */
document.getElementById('list').innerHTML = pairs.map((p, i) => `
  <div class="row" style="padding-left:${steps[i % steps.length]}%">
    <div class="pt" data-i="${i}">
      <span class="num">${num(i)}</span>
      <span class="lbl">${esc(p.name)}</span>
    </div>
  </div>`).join('');

let cur = null, openAu = -1;

function field(label, text) {
  const t = (text || '').trim();
  return `
    <div class="field">
      <div class="field-head">
        <span class="field-label">${label}</span>
        <span class="btn" data-t="${esc(t)}">복사</span>
      </div>
      <div class="box ${t ? '' : 'empty'}">${t ? esc(t) : '비어 있음'}</div>
    </div>`;
}
function sd(c) {
  const all = [c.look, c.outfit].map(s => (s || '').trim()).filter(Boolean).join(', ');
  return `
    <div class="sd">
      ${field('외관', c.look)}
      ${field('의상', c.outfit)}
      <span class="btn all" data-t="${esc(all)}">전체 복사</span>
    </div>`;
}
function panel(a) {
  const au = cur.aus[a];
  return `
    <div class="panel">
      <div class="tabs">${au.chars.map((c, k) => `<span class="tab${k ? '' : ' on'}" data-k="${k}">${esc(c.name)}</span>`).join('')}</div>
      <div class="sl" id="sl">${au.chars.map(sd).join('')}</div>
    </div>`;
}
function bindSl() {
  const sl = document.getElementById('sl');
  if (!sl) return;
  sl.addEventListener('scroll', () => {
    const k = Math.round(sl.scrollLeft / sl.clientWidth);
    view.querySelectorAll('.tab').forEach((t, j) => t.classList.toggle('on', j === k));
  });
}
function auImg(a) {
  const s = (a.image || '').trim();
  return s
    ? `<div class="au-img"><img src="${esc(s)}" alt="${esc(a.label)}" draggable="false" onload="fitCar()"></div>`
    : `<div class="au-img noimg">NO IMAGE</div>`;
}

function openPair(i) {
  cur = pairs[i];
  openAu = -1;
  const n = cur.aus.length;
  view.innerHTML = `
    <div class="top" id="top">
      <span class="back" id="back">← index</span>
      <div class="carwrap" id="carwrap"><div class="car" id="car">${cur.aus.map((a, k) => `<div class="au" data-a="${k}">${auImg(a)}</div>`).join('')}</div></div>
      <div class="aubar"><span id="aul">${esc(cur.aus[0].label)}</span><span>${n > 1 ? `<b id="aup">1</b> / ${n}` : ''}</span></div>
      <div class="hint">사진을 누르면 프롬프트가 열려요</div>
    </div>
    <div id="panel"></div>`;
  home.style.display = 'none';
  view.style.display = 'block';
  window.scrollTo(0, 0);

  /* 처음엔 애니메이션 없이 바로 가운데에 */
  const top = document.getElementById('top');
  const car = document.getElementById('car');
  top.style.transition = 'none';
  fitCar();
  top.offsetHeight;
  top.style.transition = '';

  /* 손가락 움직임에 딱 붙어서 사진 높이·글씨 위치가 같이 따라옴 (지연 없음) */
  let lastK = 0, raf = 0;
  car.addEventListener('scroll', () => {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      top.style.transition = 'none';
      fitCar();
      const k = Math.round(car.scrollLeft / car.clientWidth);
      if (k !== lastK) {
        lastK = k;
        document.getElementById('aul').textContent = cur.aus[k].label;
        const p = document.getElementById('aup');
        if (p) p.textContent = k + 1;
        /* 프롬프트가 열려 있으면 넘긴 AU의 프롬프트로 바로 바꿔서 열린 채 유지 */
        if (openAu !== -1 && openAu !== k) {
          openAu = k;
          const pn = document.getElementById('panel');
          pn.innerHTML = panel(k);
          pn.firstElementChild.style.animation = 'none';
          bindSl();
        }
      }
    });
  }, { passive: true });
  /* 넘기기 끝나면 사진 누를 때 올라가는 애니메이션 다시 켜기 */
  let restoreT;
  car.addEventListener('scroll', () => {
    clearTimeout(restoreT);
    restoreT = setTimeout(() => { top.style.transition = ''; }, 150);
  }, { passive: true });
}

/* 사진 칸 높이를 지금 보이는 사진 높이로 맞추기 */
function fitCar() {
  const car = document.getElementById('car');
  if (!car) return;
  const n = car.children.length;
  if (!n) return;
  const x = Math.max(0, Math.min(n - 1, car.scrollLeft / car.clientWidth));
  const i = Math.floor(x), f = x - i;
  const hOf = j => car.children[Math.min(j, n - 1)].firstElementChild.offsetHeight;
  /* 두 사진 사이를 넘기는 비율만큼 높이를 섞어서, 밀면 밀수록 자연스럽게 변함 */
  const h = hOf(i) * (1 - f) + hOf(i + 1) * f;
  const wrap = document.getElementById('carwrap');
  wrap.style.height = h + 'px';
  placeTop();
}

/* 프롬프트가 닫혀 있으면 사진 묶음을 화면 세로 가운데로, 열려 있으면 원래 자리(위)로 */
function placeTop() {
  const top = document.getElementById('top');
  if (!top) return;
  if (openAu !== -1) {
    top.style.transform = 'translateY(0)';
    return;
  }
  /* 사진 칸이 높이 바뀌는 중이어도 최종 높이 기준으로 계산 */
  const h = top.offsetHeight;
  const off = Math.max(0, (window.innerHeight - h) / 2 - top.offsetTop);
  top.style.transform = `translateY(${off}px)`;
}
window.addEventListener('resize', () => { if (view.style.display === 'block') fitCar(); });
function showHome() {
  view.style.display = 'none';
  home.style.display = 'flex';
}

/* 폰 뒤로가기 누르면 첫 화면으로 */
window.addEventListener('popstate', showHome);

/* 우클릭 · 사진 드래그 방지 */
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('dragstart', e => {
  if (e.target.tagName === 'IMG') e.preventDefault();
});

/* 복사 */
function done(b, msg) {
  const o = b.dataset.o || b.textContent;
  b.dataset.o = o;
  b.textContent = msg;
  clearTimeout(b._t);
  b._t = setTimeout(() => b.textContent = o, 1200);
}
function fallbackCopy(t, b) {
  const a = document.createElement('textarea');
  a.value = t;
  a.style.position = 'absolute'; a.style.opacity = '0';
  document.body.appendChild(a);
  a.select();
  try { document.execCommand('copy'); done(b, '복사됨'); }
  catch (e) { done(b, '실패'); }
  a.remove();
}

document.addEventListener('click', e => {
  const pt = e.target.closest('.pt');
  if (pt) {
    history.pushState({ pair: +pt.dataset.i }, '');
    openPair(+pt.dataset.i);
    return;
  }
  if (e.target.id === 'back') { history.back(); return; }

  const au = e.target.closest('.au');
  if (au) {
    const a = +au.dataset.a;
    const pn = document.getElementById('panel');
    if (openAu === a) { openAu = -1; pn.innerHTML = ''; }
    else { openAu = a; pn.innerHTML = panel(a); bindSl(); }
    placeTop();
    return;
  }

  const tab = e.target.closest('.tab');
  if (tab) {
    const sl = document.getElementById('sl');
    sl.scrollTo({ left: +tab.dataset.k * sl.clientWidth, behavior: 'smooth' });
    return;
  }

  const b = e.target.closest('.btn');
  if (!b) return;
  const t = b.dataset.t;
  if (!t) { done(b, '비어있음'); return; }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(t).then(() => done(b, '복사됨'), () => fallbackCopy(t, b));
  } else {
    fallbackCopy(t, b);
  }
});
</script>
</body>
</html>
